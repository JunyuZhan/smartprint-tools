<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPrint 扫码打印</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --blue:#2178ff; --bg:#f2f5f9; --card:#fff; --line:#e5e9f0; --text:#1f2733; --sub:#8a94a6; --ok:#12b76a; --err:#f04438; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding-bottom:60px; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 14px; }
  .hd { display:flex; align-items:center; gap:10px; padding:6px 2px 12px; }
  .hd h1 { font-size:19px; } .hd small { color:var(--sub); display:block; font-weight:400; font-size:12px; margin-top:2px; }
  .logo { width:40px; height:40px; border-radius:12px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(20,40,90,.06); }
  .card h3 { font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .upload { border:2px dashed #cdd7e6; border-radius:14px; padding:26px 12px; text-align:center; color:var(--sub); background:#fbfcff; cursor:pointer; transition:.15s; }
  .upload.drag { border-color:var(--blue); background:#eef4ff; color:var(--blue); }
  .upload .big { font-size:32px; }
  .upload p { font-size:13px; margin-top:6px; }
  .upload .sub { font-size:11px; margin-top:4px; opacity:.8; }
  input[type=file] { display:none; }
  .files { margin-top:12px; }
  .file { display:flex; align-items:center; gap:10px; background:#f6f8fc; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .file .nm { flex:1; font-size:14px; word-break:break-all; }
  .file .sz { font-size:11px; color:var(--sub); }
  .file .st { font-size:11px; padding:3px 8px; border-radius:20px; }
  .st.up { background:#e2f8ee; color:var(--ok); } .st.err { background:#fdeceb; color:var(--err); } .st.wait { background:#fdf1e0; color:#b45309; }
  .del { border:0; background:transparent; color:#c3cbd8; font-size:16px; cursor:pointer; padding:4px; }
  .del:hover { color:var(--err); }
  .opt { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt .full { grid-column:1 / -1; }
  label { display:block; font-size:12px; color:var(--sub); margin-bottom:6px; }
  select, input[type=number] { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 10px; font-size:14px; background:#fbfcfe; outline:none; }
  select:focus, input:focus { border-color:var(--blue); }
  .printbtn { width:100%; border:0; border-radius:14px; background:var(--blue); color:#fff; font-size:16px; font-weight:600; padding:15px 0; cursor:pointer; margin-top:4px; }
  .printbtn:disabled { background:#a9c4f5; cursor:not-allowed; }
  .msg { text-align:center; font-size:13px; padding:8px 0 0; }
  .msg .err { color:var(--err); } .msg .ok { color:var(--ok); }
  .pw { text-align:center; padding:8px 0; }
  .pw input { width:60%; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:18px; letter-spacing:4px; text-align:center; outline:none; }
  .pw button { margin-top:12px; }
  .hist { max-height:220px; overflow:auto; }
  .hist .row { display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px dashed var(--line); font-size:13px; }
  .hist .row:last-child { border-bottom:0; }
  .hist .s { margin-left:auto; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="logo">🖨</div>
    <div>
      <h1 id="officeName">扫码打印</h1>
      <small>上传文件 → 设置 → 打印，然后到打印机取件</small>
    </div>
  </div>

  <div id="pwBox" class="card pw" style="display:none;">
    <h3>🔒 请输入访问口令</h3>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="口令">
    <div><button class="printbtn" id="pinBtn" style="width:40%;">进入</button></div>
    <div class="msg err" id="pinErr"></div>
  </div>

  <div id="mainBox">
    <div class="card">
      <h3>📄 选择文件</h3>
      <div class="upload" id="dropZone">
        <div class="big">＋</div>
        <p>点击选择或拖拽文件到这里</p>
        <p class="sub">支持 图片 / PDF / Word，可多选，单文件 ≤ <span id="maxMb">50</span>MB</p>
      </div>
      <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.bmp,.webp,.tif,.tiff,.gif,.pdf,.doc,.docx,.rtf,.wps,.odt">
      <div class="files" id="fileList"></div>
    </div>

    <div class="card">
      <h3>⚙️ 打印设置</h3>
      <div class="opt">
        <div><label>色彩</label><select id="sColor"><option value="color">彩色</option><option value="mono">黑白</option></select></div>
        <div><label>双面</label><select id="sDuplex"><option value="single">单面</option><option value="long">双面·长边</option><option value="short">双面·短边</option></select></div>
        <div><label>份数</label><input type="number" id="sCopies" min="1" max="99" value="1"></div>
        <div><label>图片方向</label><select id="sOrient"><option value="auto">自动</option><option value="portrait">纵向</option><option value="landscape">横向</option></select></div>
        <div class="full"><label>图片大小</label><select id="sFit"><option value="fit">适合页面</option><option value="fill">填满页面</option><option value="original">原尺寸</option></select></div>
      </div>
    </div>

    <button class="printbtn" id="printBtn" disabled>立即打印</button>
    <div class="msg" id="msg"></div>

    <div class="card" id="histCard" style="display:none;margin-top:14px;">
      <h3>🕘 我的打印记录</h3>
      <div class="hist" id="histBox"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let CFG = null;
let FILES = [];   // {id, name, size, status, error}
let PIN_REQ = false;

async function api(path, opts){
  const r = await fetch(path, opts);
  let d;
  try { d = await r.json(); } catch(e){ throw new Error('网络异常（' + r.status + '）'); }
  if (d && d.code === 'need_auth') { showPin(); throw new Error('need_pin'); }
  return d;
}

async function init(){
  try {
    const d = await api('/api/config');
    CFG = d;
    PIN_REQ = !!d.pin_required;
    $('#officeName').textContent = d.office_name || '扫码打印';
    $('#maxMb').textContent = d.max_upload_mb || 50;
    const pd = d.print_defaults || {};
    $('#sColor').value = pd.color || 'color';
    $('#sDuplex').value = pd.duplex || 'single';
    $('#sCopies').value = pd.copies || 1;
    $('#sOrient').value = pd.orientation || 'auto';
    $('#sFit').value = pd.fit || 'fit';
    if (PIN_REQ) showPin(); else loadHistory();
  } catch(e){ if (e.message !== 'need_pin') $('#msg').innerHTML = '<span class="err">加载失败，请刷新重试</span>'; }
}

function showPin(){
  $('#pwBox').style.display = '';
  $('#mainBox').style.display = 'none';
}
$('#pinBtn').onclick = async () => {
  const pin = $('#pinInput').value.trim();
  if (!pin) return;
  try {
    const d = await api('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin})});
    if (d.ok){ $('#pwBox').style.display='none'; $('#mainBox').style.display=''; loadHistory(); }
  } catch(e){ $('#pinErr').textContent = '口令错误，请重试'; }
};

const dz = $('#dropZone');
const fi = $('#fileInput');
function openPicker(){ fi.click(); }
dz.onclick = openPicker;
fi.onchange = () => uploadFiles(fi.files);
['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
dz.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));

async function uploadFiles(fileList){
  if (!fileList || !fileList.length) return;
  const fd = new FormData();
  for (const f of fileList) fd.append('file', f);
  $('#msg').innerHTML = '<span class="ok">上传中…</span>';
  try {
    const d = await api('/api/upload', {method:'POST', body:fd});
    if (d.ok){
      for (const j of d.jobs){
        FILES.push({id:j.id, name:j.name, size:fmt(j.size), status:'up', error:''});
      }
      renderFiles(); refreshPrintBtn();
      $('#msg').innerHTML = '<span class="ok">上传成功，可设置后打印</span>';
    } else {
      $('#msg').innerHTML = '<span class="err">' + esc(d.error||'上传失败') + '</span>';
    }
  } catch(e){
    if (e.message !== 'need_pin') $('#msg').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
  }
  fi.value = '';
}

function renderFiles(){
  $('#fileList').innerHTML = FILES.map((f,i)=>`
    <div class="file">
      <span class="nm">${esc(f.name)}</span>
      <span class="sz">${f.size}</span>
      <span class="st ${f.status}">${f.status==='up'?'已上传':f.status==='err'?'失败':'等待'}</span>
      <button class="del" data-i="${i}">✕</button>
    </div>`).join('');
  document.querySelectorAll('.del').forEach(b=>b.onclick = () => { FILES.splice(+b.dataset.i,1); renderFiles(); refreshPrintBtn(); });
}

function refreshPrintBtn(){
  const has = FILES.some(f => f.status === 'up');
  $('#printBtn').disabled = !has;
}

$('#printBtn').onclick = async () => {
  const ids = FILES.filter(f=>f.status==='up').map(f=>f.id);
  if (!ids.length) return;
  const settings = {
    color: $('#sColor').value,
    duplex: $('#sDuplex').value,
    copies: Math.min(99, Math.max(1, +$('#sCopies').value || 1)),
    orientation: $('#sOrient').value,
    fit: $('#sFit').value,
  };
  $('#printBtn').disabled = true;
  $('#msg').innerHTML = '<span class="ok">已提交打印…</span>';
  try {
    const d = await api('/api/print', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({job_ids:ids, settings})});
    if (d.ok){
      FILES = FILES.filter(f=>!ids.includes(f.id));
      renderFiles(); refreshPrintBtn();
      $('#msg').innerHTML = '<span class="ok">✓ 打印已提交，请到打印机取件</span>';
      setTimeout(()=>{ $('#msg').textContent=''; }, 4000);
      loadHistory();
    } else {
      $('#msg').innerHTML = '<span class="err">' + esc(d.error||'打印失败') + '</span>';
      $('#printBtn').disabled = false;
    }
  } catch(e){
    if (e.message !== 'need_pin') $('#msg').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
    $('#printBtn').disabled = false;
  }
};

async function loadHistory(){
  try {
    const d = await api('/api/jobs');
    const jobs = (d.jobs||[]).filter(j=>['done','failed','printing','queued'].includes(j.status)).slice(0,20);
    if (!jobs.length) return;
    $('#histCard').style.display = '';
    const stMap = {done:'✓ 完成', failed:'✕ 失败', printing:'打印中', queued:'排队中'};
    $('#histBox').innerHTML = jobs.map(j=>`
      <div class="row">
        <span>${esc(j.name)}</span>
        <span class="s ${j.status}">${stMap[j.status]||j.status}</span>
      </div>`).join('');
  } catch(e){}
}

function fmt(n){
  if (n > 1048576) return (n/1048576).toFixed(1)+'MB';
  if (n > 1024) return Math.round(n/1024)+'KB';
  return n+'B';
}
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

init();
</script>
</body>
</html>
