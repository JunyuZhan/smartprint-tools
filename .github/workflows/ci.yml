name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 单元测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（核心依赖，不含 pywin32）
        run: |
          python -m pip install --upgrade pip
          pip install Flask waitress Pillow PyMuPDF qrcode requests psutil pystray pytest
      - name: 语法检查
        run: python -m compileall -q smartprint server.py tests
      - name: 单元测试
        run: python -m pytest tests/test_core.py -v

  build:
    name: 打包 Windows 绿色版
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（含 pywin32 与 PyInstaller）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean smartprint.spec
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SmartPrint-windows
          path: dist/SmartPrint
          if-no-files-found: error
